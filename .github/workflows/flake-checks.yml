name: Flake checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate every system
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Evaluate all flake checks
        run: nix flake check --all-systems --no-build --show-trace

  linux:
    name: Linux Home Manager and static checks
    needs: evaluate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build Linux checks
        run: >-
          nix build --print-build-logs
          .#checks.x86_64-linux.linux-home-manager
          .#checks.x86_64-linux.evaluation
          .#checks.x86_64-linux.formatting
          .#checks.x86_64-linux.shell
          .#checks.x86_64-linux.nix-config-helpers

  darwin:
    name: Apple Silicon nix-darwin and static checks
    needs: evaluate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Confirm runner architecture
        run: test "$(uname -m)" = arm64
      - name: Build Darwin checks
        run: >-
          nix build --print-build-logs
          .#checks.aarch64-darwin.darwin
          .#checks.aarch64-darwin.evaluation
          .#checks.aarch64-darwin.formatting
          .#checks.aarch64-darwin.homebrew-preflight
          .#checks.aarch64-darwin.local-private-tools
          .#checks.aarch64-darwin.shell
          .#checks.aarch64-darwin.nix-config-helpers

output_dir = "@homeDirectory@/meetings"

[recording]
# `minutes record` remains microphone-only. The Nix-managed `minutes-call`
# helper adds voice=default and call=auto for native dual-source call capture.
capture_backend = "core-audio-tap"

[identity]
name = "Michael Klug"

[transcription]
engine = "whisper"
model = "large-v3"
vad_model = "silero-v6.2.0"
# Streaming ORT-Silero is O(new audio). whisper-Silero rescans its full rolling
# buffer for every CoreAudio callback and fell to ~0.68x realtime on this Mac.
vad_engine = "ort-silero"
partial_max_secs = 30

[diarization]
engine = "auto"
embedding_model = "cam++"
threshold = 0.4

[summarization]
# Keep transcripts local unless a summarizer is selected deliberately.
engine = "none"

[watch]
paths = ["@homeDirectory@/.minutes/inbox"]
extensions = ["m4a", "wav", "mp3", "ogg", "webm"]
type = "memo"
delete_source = false
settle_delay_ms = 2000
dictation_threshold_secs = 120

[dictation]
backend = "whisper"
model = "small"
accumulate = true
daily_note_log = true
cleanup_engine = "rules"
cleanup_remove_fillers = true
cleanup_spoken_punctuation = false
cleanup_apply_vocabulary = false
auto_paste = false
silence_timeout_ms = 2000
max_utterance_secs = 120

[live_transcript]
backend = "inherit"
model = "small"
max_utterance_secs = 30
save_wav = true
promote_on_stop = "process"

[voice]
enabled = true
match_threshold = 0.65
store_meeting_embeddings = true
passive_candidate_capture = false
restricted_meetings_eligible = false
retain_non_self_embeddings = false

[screen_context]
enabled = false
keep_after_summary = false

[desktop_context]
enabled = false

[calendar]
enabled = true

[call_detection]
enabled = true
poll_interval_secs = 1
cooldown_minutes = 5
apps = ["zoom.us", "Microsoft Teams", "Webex"]
stop_when_call_ends = false

[palette]
# Avoid reserving a global shortcut for the CLI-only Homebrew install.
shortcut_enabled = false
shortcut = "CmdOrCtrl+Shift+K"

[privacy]
hide_from_screen_share = true

[consent]
mode = "remind"

[retention]
successful_audio_days = 14
failed_audio_days = 30
restricted_audio_days = 3
keep_pinned_audio = true
auto_cleanup = false
cleanup_on_startup = false
warn_above_gb = 2

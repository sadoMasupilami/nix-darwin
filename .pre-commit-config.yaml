# Local hooks only: the linters come from `nix develop`, so they match the
# versions the flake checks use. `pre-commit install` sets up both the
# pre-commit and the commit-msg hook in this checkout.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
      - id: statix
        name: statix
        # statix takes a single target per run.
        entry: bash -c 'status=0; for file in "$@"; do statix check "$file" || status=1; done; exit "$status"' --
        language: system
        types: [nix]
      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        types: [nix]
      - id: shell
        name: shellcheck and zsh -n
        entry: .github/hooks/check-shell.sh
        language: system
        types: [text]

      # Both patterns skip lines that start with a diff marker, so the diff
      # that `git commit -v` appends never matches.
      - id: no-ai-trailer
        name: no AI co-author trailer
        entry: '(?i)^\w[\w-]*-by:.*\b(claude|anthropic|chatgpt|openai|copilot|gemini|codex|cursor)\b'
        language: pygrep
        stages: [commit-msg]
      - id: no-ai-footer
        name: no "Generated with" AI footer
        entry: '(?i)^(?![-+ ])\W*generated (with|by)\b.*\b(ai|claude|anthropic|chatgpt|openai|copilot|gemini|codex|cursor)\b'
        language: pygrep
        stages: [commit-msg]
      # Leading blank and comment lines are skipped, as git strips them.
      # Merge, git revert and autosquash subjects stay allowed.
      - id: conventional-subject
        name: "commit subject is type(scope)!: description"
        entry: '\A(?:(?:#[^\n]*)?\n)*(?:(?:fixup|squash|amend)! )*(?:(?:feat|fix|refactor|perf|docs|chore|test|ci|build|style|revert)(?:\([^()\n]+\))?!?: \S|Merge |Revert ")'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]
